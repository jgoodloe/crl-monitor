# Auto-approve and auto-merge Dependabot PRs for patch and minor updates once
# all required status checks (the Tests workflow) pass. Major-version updates
# are intentionally NOT merged automatically — they are left open for a human
# to review, since that is where breaking changes appear.
#
# Requirements in repo settings (one-time, cannot be set from a file):
#   * Settings → General → Pull Requests → "Allow auto-merge" enabled.
#   * A branch protection / ruleset on the default branch that requires the
#     "pytest" status check to pass before merging — this is what makes
#     `--auto` actually wait for CI instead of merging immediately.
#
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on PRs opened by Dependabot itself.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Approve and enable auto-merge (patch & minor only)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          # Approval is best-effort: branch protection on main requires no
          # approving review (only the pytest + cve-scan checks), so a review
          # isn't needed to merge. It also fails outright unless "Allow GitHub
          # Actions to create and approve pull requests" is enabled. Either way,
          # don't let it block enabling auto-merge — that's the step that matters.
          gh pr review --approve "$PR_URL" \
            || echo "::notice::Self-approval skipped (not required by branch protection); enabling auto-merge anyway."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note on major updates (held for review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "⚠️ This is a **major** version update (\`${{ steps.meta.outputs.dependency-names }}\` → ${{ steps.meta.outputs.new-version }}). Auto-merge is intentionally skipped — please review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
