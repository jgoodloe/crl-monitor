name: Tests

on:
  pull_request:
  # Callable as a reusable workflow so the release pipeline (docker-publish.yml)
  # can gate publishing on these tests. Direct pushes to main are covered by the
  # release pipeline calling this, so there's no standalone push trigger here
  # (avoids running pytest twice for the same commit).
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
